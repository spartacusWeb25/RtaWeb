{% extends "base.html" %}

{% block title %}Excluir eventos agrupados - RtaWeb{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header fw-semibold">
        Confirmação
    </div>
    <div class="card-body">
        <p>Tem certeza que deseja excluir a configuração de eventos agrupados?</p>
        <form method="post" novalidate>
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'eventos_agrupados:listar' %}?banco={{ request.banco }}"
               class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
