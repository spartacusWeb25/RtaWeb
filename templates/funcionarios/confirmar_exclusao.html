{% extends "base.html" %}

{% block title %}Excluir Funcionário — RtaWeb{% endblock %}

{% block content %}
<div class="card shadow-sm" style="background: var(--surface-card, var(--bs-card-bg)); border-color: var(--border-default, var(--bs-border-color));">
    <div class="card-header fw-semibold" style="background: var(--surface-th, var(--bs-secondary-bg)); color: var(--text-primary, var(--bs-emphasis-color)); border-color: var(--border-default, var(--bs-border-color));">
        Confirmação
    </div>
    <div class="card-body" style="color: var(--text-primary, var(--bs-body-color));">
        <p>Deseja realmente excluir <strong>{{ funcionario.func_nome|default:'Funcionário' }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'funcionarios:listar' %}?banco={{ request.banco }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
