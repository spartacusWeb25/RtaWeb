{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    {% if modo_edicao %}
    <h1>Editar Tabela Salário Familia</h1>
    {% else %}
    <h4>Nova Tabela Salário Familia</h4>
    {% endif %}


    <form method="post" class="card p-3">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>
    </form>
</div>
{% endblock %}
