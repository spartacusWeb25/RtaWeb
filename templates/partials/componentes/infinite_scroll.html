<div class="infinite-scroll" data-infinite-scroll-root
  data-infinite-scroll-items-selector="{{ infinite_scroll_items_selector|default:'[data-infinite-scroll-items]' }}"
  data-infinite-scroll-next-url="{{ infinite_scroll_next_url|default:'' }}">
  <div class="infinite-scroll-status" data-infinite-scroll-status></div>
  <div class="infinite-scroll-sentinel" data-infinite-scroll-sentinel></div>
</div>
