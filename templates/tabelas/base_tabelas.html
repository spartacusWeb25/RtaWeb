{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link href="{% static 'core/css/forms-global.css' %}" rel="stylesheet">
<link href="{% static 'core/css/list-cards.css' %}" rel="stylesheet">
<link href="{% static 'core/css/tabelas-layout.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="tabelas-page">
    <div class="tabelas-row">

        <aside class="tabelas-sidebar-wrap d-none d-md-block">
            <div class="sidebar">
                <h4><i class="bi bi-tablet-landscape"></i> Tabelas</h4>

                <a href="{% url 'tabelasalafami:salafami_listar' %}?banco={{ request.banco }}">Salário Família</a>
                <a href="{% url 'tabelasalariominimo:listar' %}?banco={{ request.banco }}">Salário mínimo</a>
                <a href="{% url 'inss_list' %}" class="{% if request.resolver_match.url_name == 'inss_list' %}active{% endif %}">INSS</a>
                <a href="{% url 'irrf_list' %}" class="{% if request.resolver_match.url_name == 'irrf_list' %}active{% endif %}">IRPF</a>
            </div>
        </aside>

        <main class="tabelas-main">

            <div class="d-md-none mb-3">
                <div class="d-flex flex-wrap gap-2">
                    <a href="{% url 'tabelasalafami:salafami_listar' %}?banco={{ request.banco }}" class="btn btn-outline-secondary btn-sm">Salário Família</a>
                    <a href="{% url 'tabelasalariominimo:listar' %}?banco={{ request.banco }}" class="btn btn-outline-secondary btn-sm">Salário mínimo</a>
                    <a href="{% url 'inss_list' %}" class="btn btn-outline-primary btn-sm">INSS</a>
                    <a href="{% url 'inss_empresa_list' %}" class="btn btn-outline-primary btn-sm">INSS Empresa</a>
                    <a href="{% url 'irrf_list' %}" class="btn btn-outline-primary btn-sm">IRPF</a>
                    <a href="#" class="btn btn-outline-secondary btn-sm">PIS</a>
                </div>
            </div>

            {% block tabelas_content %}{% endblock %}

        </main>

    </div>
</div>
{% endblock %}
